[package]
name = "prequel-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
prequel-session = { workspace = true }
cidre = { workspace = true, features = [
  "av",
  "vt",
  "cv",
  "cm",
  "cat",
  "blocks",
  "async",
  # av::player needs it; not implied by "av" itself.
  "dispatch",
  "macos_15_0",
] }
thiserror = { workspace = true }
tracing = { workspace = true }

# GIF encoding, including the NeuQuant palette pass through its default
# `color_quant` feature. No Apple framework writes GIF, so this is the one
# format the app encodes in software.
gif = "0.13"

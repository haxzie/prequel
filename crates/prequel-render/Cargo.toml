[package]
name = "prequel-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prequel-encode = { workspace = true }
prequel-session = { workspace = true }
cidre = { workspace = true, features = [
  "av",
  "cv",
  "cm",
  "cat",
  "cg",
  "mtl",
  "blocks",
  "async",
  "dispatch",
  "macos_15_0",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Opens `compositor` and `reader` to the GPUI spike in `spikes/gpui`. Off by
# default; nothing in the app enables it.
spike = []

appId: com.prequel.desktop
productName: Prequel
directories:
  buildResources: build
  output: release

files:
  - "out/**/*"
  # The tray icons are read from `out/main/../../resources`, so they have to
  # ship alongside the bundle rather than only existing in the source tree.
  - "resources/**/*"
  - "package.json"

# The native addon is a `.node` binary: it cannot be `dlopen`'d from inside an
# asar archive, so it has to sit on the real filesystem.
asarUnpack:
  - "**/*.node"
  - "**/@prequel/recorder/**"
  # `nativeImage.createFromPath` is native code and cannot read through asar,
  # so a tray icon left inside the archive loads as an empty image. An empty
  # image is an invisible menu-bar item, and since `LSUIElement` gives the app
  # no menu of its own, that leaves no way to quit it.
  - "resources/**"

mac:
  category: public.app-category.developer-tools
  # Generated by `pnpm app-icon` from `build/icon-source.png`, which applies the
  # squircle mask and the 824-of-1024 inset macOS expects. Committed, so a build
  # needs no image tooling.
  icon: build/icon.icns
  # Apple Silicon only, matching the capture core.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extendInfo:
    # Menu-bar app: no Dock icon, no window on launch. Baked into Info.plist
    # rather than set at runtime so it applies before the app draws.
    LSUIElement: true
    # macOS terminates the app on first access if these are missing. Screen
    # Recording needs no key — it is a TCC prompt with no usage description.
    NSCameraUsageDescription: Prequel records your camera when you turn it on for a recording.
    NSMicrophoneUsageDescription: Prequel records your microphone when you turn it on for a recording.
    NSAudioCaptureUsageDescription: Prequel records your computer's audio when system audio is enabled.
  # Hardened runtime and notarisation need a Developer ID, which this machine
  # does not have. Left off so a local build succeeds; turn both on, together
  # with `notarize`, before distributing to anyone else.
  hardenedRuntime: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

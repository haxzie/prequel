appId: com.prequel.desktop
productName: Prequel
directories:
  buildResources: build
  output: release

# The default UDZO (zlib) image leaves 9 MB on the table next to bzip2, which is
# what `maximum` selects for a DMG. It costs build time and nothing at install
# time — macOS mounts either without a plugin.
compression: maximum

# Present so electron-builder writes `latest-mac.yml` beside the artefacts and
# embeds `app-update.yml` in the bundle — both come from having a publish config
# at all, not from passing `--publish`, so the `package` script needs no flag.
# A generic provider can never upload anything, so a tag build cannot publish
# behind our back either.
#
# The URL here is not where a running app looks. `main/update.ts` calls
# `setFeedURL` with `apiUrl()` instead, so a build pointed at another deployment
# through NEXT_PUBLIC_API_URL does not also have to edit this file.
#
# `useMultipleRangeRequest` is off because GitHub serves release assets from
# Azure Blob, which answers 501 to a multi-range request — see the differential
# download note in `main/update.ts`.
publish:
  provider: generic
  url: https://api.prequel.sh/v1/updates/darwin-arm64
  useMultipleRangeRequest: false

files:
  - "out/**/*"
  # The tray icons are read from `out/main/../../resources`, so they have to
  # ship alongside the bundle rather than only existing in the source tree.
  - "resources/**/*"
  - "package.json"
  # `zod` reaches the bundle only as a dependency of `@prequel/env`, which
  # `externalizeDepsPlugin` is told to bundle rather than externalise — so every
  # schema is already inlined into `out/main/index.js`. Nothing `require`s the
  # package at runtime, but electron-builder collects production dependencies
  # transitively and would ship 4 MB of it, source tree and tests included.
  - "!node_modules/zod/**"

# The native addon is a `.node` binary: it cannot be `dlopen`'d from inside an
# asar archive, so it has to sit on the real filesystem.
asarUnpack:
  - "**/*.node"
  - "**/@prequel/recorder/**"
  # `nativeImage.createFromPath` is native code and cannot read through asar,
  # so a tray icon left inside the archive loads as an empty image. An empty
  # image is an invisible menu-bar item, and since `LSUIElement` gives the app
  # no menu of its own, that leaves no way to quit it.
  - "resources/**"

# Chromium ships a `locale.pak` for all 220 of its locales, 47 MB of the bundle.
# The UI is English-only and none of it is translated, so the rest are dead
# weight. This is the Chromium UI language, not the app's — keep `en-US` even if
# the app is never localised, because an empty list makes Electron ship none and
# Chromium then has no strings for its own menus and dialogs.
electronLanguages:
  - en-US

mac:
  category: public.app-category.developer-tools
  # Generated by `pnpm app-icon` from `build/icon-source.png`, which applies the
  # squircle mask and the 824-of-1024 inset macOS expects. Committed, so a build
  # needs no image tooling.
  icon: build/icon.icns
  # Apple Silicon only, matching the capture core.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extendInfo:
    # Menu-bar app: no Dock icon, no window on launch. Baked into Info.plist
    # rather than set at runtime so it applies before the app draws.
    LSUIElement: true
    # macOS terminates the app on first access if these are missing. Screen
    # Recording needs no key — it is a TCC prompt with no usage description.
    NSCameraUsageDescription: Prequel records your camera when you turn it on for a recording.
    NSMicrophoneUsageDescription: Prequel records your microphone when you turn it on for a recording.
    NSAudioCaptureUsageDescription: Prequel records your computer's audio when system audio is enabled.
    # Claims prequel:// so the browser can hand a finished sign-in back to the
    # app. `app.setAsDefaultProtocolClient` alone is not enough for a packaged
    # build — Launch Services reads the scheme out of Info.plist, and without
    # this entry the link resolves to nothing and signing in silently never
    # completes.
    CFBundleURLTypes:
      - CFBundleURLName: sh.prequel.auth
        CFBundleURLSchemes:
          - prequel
  # Signed and notarised with a Developer ID.
  #
  # `identity` is deliberately absent rather than named: electron-builder then
  # finds the Developer ID Application certificate in the keychain, so this file
  # carries no team id and works for anyone with their own. A machine with no
  # certificate gets an unsigned build and a warning, not a failure.
  #
  # Hardened runtime is what notarisation requires, and the entitlements below
  # are what make it survivable — V8 needs executable memory, and the native
  # recorder addon is not signed by Electron's team, so library validation has to
  # be off or the app cannot load its own capture core.
  hardenedRuntime: true
  # Runs only when the credentials are in the environment: `APPLE_API_KEY`,
  # `APPLE_API_KEY_ID` and `APPLE_API_ISSUER`, or the Apple ID trio. CI sets none
  # of them and sets `CSC_IDENTITY_AUTO_DISCOVERY=false` besides, so its builds
  # stay unsigned rather than failing for want of a certificate it cannot hold.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  # The same wash the welcome window opens on — near-black under the icon's own
  # sunrise, fading out before it reaches the icons. Generated by
  # `pnpm dmg`, which reads its numbers from `Welcome.tsx` so the installer and
  # the first run cannot drift apart.
  #
  # A multi-representation TIFF rather than a `@2x` PNG pair: `@2x` is a
  # convention of the app bundle loader, not of the Finder, so on a Retina
  # display the pair silently gets the 1x scaled up — which on soft gradients
  # looks like nothing is wrong.
  background: build/background.tiff
  # The volume name, which is also what the Finder prints in the title bar.
  #
  # Left to itself electron-builder names it `${productName} ${version}-${arch}`,
  # so the installer was headed "Prequel 0.0.4-arm64". The title bar itself
  # cannot be removed — a disk image opens in a Finder window and that window has
  # one — but it can at least say the product's name and nothing else.
  title: Prequel
  # There is deliberately no `window:` here. dmg-builder reads the background
  # with `sips` and sets the Finder window's frame to the image's size,
  # discarding anything set here — see `dmgUtil.js`, where the derived size is
  # spread over it. The size lives in the generator instead, which is the only
  # place that can actually decide it.
  iconSize: 128
  # The frame is the image's 420, and Finder's title bar takes ~28 of it, so
  # only the top 392 points are ever on screen. Finder grows its scrollable area
  # to reach any icon placed past that — a disk image with a scroll bar in it,
  # which is what the first cut of this shipped. At 250 the icon runs to 314 and
  # its label to about 336, clear of the edge.
  #
  # These are also what the arrow in the background points along: move one and
  # `ARROW` in that script has to move with it.
  contents:
    - x: 130
      y: 250
    - x: 410
      y: 250
      type: link
      path: /Applications

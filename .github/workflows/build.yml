name: Build

# Not on pull requests. Packaging produces a 100 MB disk image and takes several
# minutes of macOS time on every push; the checks in `ci.yml` are what a PR needs.
# Use the Run workflow button to get a build for a branch on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    permissions:
      # Only so the tag path can create the release. Reads are implicit.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # `gh release create --generate-notes` writes its changelog from the
          # commits since the previous tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Electron binary is ~100 MB and identical between runs, so it is worth
      # not fetching twice. Keyed on the version in the lockfile: a bump has to
      # miss the cache or the build would package the previous Electron.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The version in the tag has to be the version electron-builder will stamp
      # on the files, because it takes that from package.json and not from the ref.
      # Without this check, tagging v0.2.0 without bumping first produces a release
      # full of files called Prequel-0.1.0 — which looks like the wrong build was
      # published, and is impossible to tell apart from one.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop version $version."
            echo "Bump the version, commit it, then tag that commit."
            exit 1
          fi
          echo "tag and version agree on $version"

      # Only the addon, not the whole workspace: the marketing site is not part of
      # a desktop build, and `package` runs the desktop's own `electron-vite build`
      # itself. The addon has to exist first — electron-builder packages the
      # `.node` binary rather than producing it.
      - name: Build the native addon
        run: pnpm --filter @prequel/recorder build

      # electron-builder wants a *path* for `APPLE_API_KEY`, not the key itself, so
      # the secret is written out here. Absent, and the build simply is not
      # notarised — which is the right outcome for a fork, and for any push made
      # before the credentials were added.
      - name: Provide the notarisation key
        id: notary
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "no notarisation key in secrets; this build will not be notarised"
            exit 0
          fi
          path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Signed only when the certificate is there. `CSC_IDENTITY_AUTO_DISCOVERY`
      # has to be turned off explicitly when it is not: electron-builder otherwise
      # searches a keychain that holds nothing, which is a slow way to be told.
      #
      # An unsigned build is ad-hoc signed, so macOS quarantines it on any other
      # machine. Still worth producing — the artefact is what a maintainer
      # downloads to check a change — but it is not something to hand to a user.
      #
      # The certificate must be a **Developer ID Application** one. An Apple
      # Distribution certificate is for the App Store: it signs happily here and
      # Gatekeeper still refuses the download, so the failure lands on users
      # rather than in this log.
      #
      # ---
      #
      # The origins baked into the app, and the reason the two variables below
      # exist at all.
      #
      # `pnpm install` above seeds `.env` from `.env.example`, which pins both to
      # localhost so a clone runs with no setup. `publicEnv` in
      # `electron.vite.config.ts` bakes whatever `.env` says into the main bundle
      # — so without these, this workflow produces a signed, notarised disk image
      # whose Sign in button opens `http://localhost:3000`. It did.
      #
      # Vite's `loadEnv` applies the process environment over the file, so
      # setting them here wins. Repository variables let a fork point at its own
      # deployment; the fallbacks are this one's.
      #
      # `check-release-env.mjs` runs inside `package` and fails the build if
      # either still resolves to localhost, before anything is signed.
      - name: Package
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://prequel.sh' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.prequel.sh' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_API_KEY: ${{ steps.notary.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @prequel/desktop package

      - name: Name the build
        id: name
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Kept for every run, tagged or not, so a build of main can be downloaded
      # and opened without cutting a release for it.
      - uses: actions/upload-artifact@v4
        with:
          name: prequel-${{ steps.name.outputs.version }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          # A disk image compresses no further, and these are ~100 MB each.
          compression-level: 0
          retention-days: 14

      # `gh` rather than a third-party action: it is already on the runner and
      # authenticated by the token, so this is one less thing to trust.
      #
      # `latest-mac.yml` is what makes the release an update: `/v1/updates` in
      # the Worker redirects the app's updater at it, and without it in the
      # release every installed copy checks, gets a 404, and stays where it is.
      #
      # No `.blockmap` on purpose. Differential download is turned off in
      # `main/update.ts` — GitHub's asset host answers 501 to the multi-range
      # request it needs — so publishing them would only look like a delta path
      # that works.
      #
      # An unsigned build (no `CSC_LINK` secret) still produces a release, and
      # an installed copy of it can never update in place: Squirrel refuses a
      # replacement whose signature does not match what is running. Do not tag
      # from a run that was not signed.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/latest-mac.yml \
            --title "Prequel $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

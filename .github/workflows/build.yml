name: Build

# Not on pull requests. Packaging produces a 100 MB disk image and takes several
# minutes of macOS time on every push; the checks in `ci.yml` are what a PR needs.
# Use the Run workflow button to get a build for a branch on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Called by `release.yml` once a version pull request has merged and the tag
  # has been pushed.
  #
  # Called rather than left to the tag event above, and the reason is GitHub's
  # recursion guard: a tag pushed by a workflow's own `GITHUB_TOKEN` raises no
  # `push` event, so `tags: ["v*"]` would never fire for a release this project
  # now cuts automatically. The alternative is a personal access token held as a
  # secret purely to make an event happen, which is a credential to rotate in
  # exchange for nothing.
  workflow_call:
    inputs:
      tag:
        description: "The tag to publish, e.g. v0.1.0. Already pushed."
        required: true
        type: string

concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

# Every step that asks "is this a release" asks it here, once. `github.ref` is
# `refs/heads/main` when this is called by `release.yml` — the tag exists, but
# the run is not *on* it — so the ref alone answers no for exactly the runs that
# are publishing.
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASING: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  package:
    runs-on: macos-15
    permissions:
      # Only so the tag path can create the release. Reads are implicit.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # `gh release create --generate-notes` writes its changelog from the
          # commits since the previous tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `SpeechAnalyzer` is a macOS 26 API, and the runner's default is Xcode
      # 16.4 — whose SDK does not contain it, so `crates/prequel-speech` fails
      # to compile with "cannot find 'SpeechAnalyzer' in scope" rather than
      # with anything that names the real problem. The app still *runs* on
      # macOS 14: the analyzer is behind `if #available`, and a newer SDK is
      # what makes that gate work at all.
      #
      # Newest 26 present rather than a pinned patch, so an image update that
      # drops 26.3 for 26.4 does not break the build.
      - name: Build against the macOS 26 SDK
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Electron binary is ~100 MB and identical between runs, so it is worth
      # not fetching twice. Keyed on the version in the lockfile: a bump has to
      # miss the cache or the build would package the previous Electron.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The version in the tag has to be the version electron-builder will stamp
      # on the files, because it takes that from package.json and not from the ref.
      # Without this check, tagging v0.2.0 without bumping first produces a release
      # full of files called Prequel-0.1.0 — which looks like the wrong build was
      # published, and is impossible to tell apart from one.
      - name: Check the tag matches the app version
        if: env.RELEASING == 'true'
        run: |
          tag="${TAG#v}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $TAG does not match apps/desktop version $version."
            echo "Bump the version, commit it, then tag that commit."
            exit 1
          fi
          echo "tag and version agree on $version"

      # Only the addon, not the whole workspace: the marketing site is not part of
      # a desktop build, and `package` runs the desktop's own `electron-vite build`
      # itself. The addon has to exist first — electron-builder packages the
      # `.node` binary rather than producing it.
      - name: Build the native addon
        run: pnpm --filter @prequel/recorder build

      # electron-builder wants a *path* for `APPLE_API_KEY`, not the key itself, so
      # the secret is written out here. Absent, and the build simply is not
      # notarised — which is the right outcome for a fork, and for any push made
      # before the credentials were added.
      - name: Provide the notarisation key
        id: notary
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "no notarisation key in secrets; this build will not be notarised"
            exit 0
          fi
          path="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Signed only when the certificate is there. `CSC_IDENTITY_AUTO_DISCOVERY`
      # has to be turned off explicitly when it is not: electron-builder otherwise
      # searches a keychain that holds nothing, which is a slow way to be told.
      #
      # An unsigned build is ad-hoc signed, so macOS quarantines it on any other
      # machine. Still worth producing — the artefact is what a maintainer
      # downloads to check a change — but it is not something to hand to a user.
      #
      # The certificate must be a **Developer ID Application** one. An Apple
      # Distribution certificate is for the App Store: it signs happily here and
      # Gatekeeper still refuses the download, so the failure lands on users
      # rather than in this log.
      #
      # ---
      #
      # The origins baked into the app, and the reason the two variables below
      # exist at all.
      #
      # `pnpm install` above seeds `.env` from `.env.example`, which pins both to
      # localhost so a clone runs with no setup. `publicEnv` in
      # `electron.vite.config.ts` bakes whatever `.env` says into the main bundle
      # — so without these, this workflow produces a signed, notarised disk image
      # whose Sign in button opens `http://localhost:3000`. It did.
      #
      # Vite's `loadEnv` applies the process environment over the file, so
      # setting them here wins. Repository variables let a fork point at its own
      # deployment; the fallbacks are this one's.
      #
      # `check-release-env.mjs` runs inside `package` and fails the build if
      # either still resolves to localhost, before anything is signed.
      - name: Package
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://prequel.sh' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.prequel.sh' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_API_KEY: ${{ steps.notary.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @prequel/desktop package

      # The command line ships *inside* the app — `out/cli/prequel.cjs`, unpacked
      # from the asar so the Electron binary can run it as plain Node — and
      # nothing else in this build would notice if it were missing. A wrong
      # `asarUnpack` glob, or a `package` that stopped running `build-cli.mjs`,
      # produces a perfectly good disk image whose `prequel` answers "Prequel's
      # command line tool is missing" on somebody else's Mac. The same class of
      # silent failure as the shaders, caught the same way: by looking in the
      # artefact rather than trusting the build.
      #
      # Run, not just stat'd. `guide` needs no app running and no permissions,
      # and it is the one command every agent calls first — so a bundle that
      # cannot even print its own contract is one worth failing the build for.
      - name: Check the command line shipped
        run: |
          app="apps/desktop/release/mac-arm64/Prequel.app"
          cli="$app/Contents/Resources/app.asar.unpacked/out/cli/prequel.cjs"
          skill="$app/Contents/Resources/app.asar.unpacked/resources/skill/SKILL.md"

          for file in "$cli" "$skill"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is not in the packaged app."
              exit 1
            fi
          done

          guide=$(ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Prequel" "$cli" guide --json)
          node -e '
            const guide = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const version = require("./apps/desktop/package.json").version;
            if (guide.version !== version) {
              throw new Error(`the command line reports ${guide.version}, the app is ${version}`);
            }
            if (!guide.commands.some((command) => command.name === "record.window")) {
              throw new Error("the guide has no record command in it");
            }
            console.log(`prequel ${guide.version}, protocol ${guide.protocol}, ${guide.commands.length} commands`);
          ' <<< "$guide"

      - name: Name the build
        id: name
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # Kept for every run, tagged or not, so a build of main can be downloaded
      # and opened without cutting a release for it.
      - uses: actions/upload-artifact@v4
        with:
          name: prequel-${{ steps.name.outputs.version }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          # A disk image compresses no further, and these are ~100 MB each.
          compression-level: 0
          retention-days: 14

      # `gh` rather than a third-party action: it is already on the runner and
      # authenticated by the token, so this is one less thing to trust.
      #
      # `latest-mac.yml` is what makes the release an update: `/v1/updates` in
      # the Worker redirects the app's updater at it, and without it in the
      # release every installed copy checks, gets a 404, and stays where it is.
      #
      # No `.blockmap` on purpose. Differential download is turned off in
      # `main/update.ts` — GitHub's asset host answers 501 to the multi-range
      # request it needs — so publishing them would only look like a delta path
      # that works.
      #
      # An unsigned build (no `CSC_LINK` secret) still produces a release, and
      # an installed copy of it can never update in place: Squirrel refuses a
      # replacement whose signature does not match what is running. Do not tag
      # from a run that was not signed.
      #
      # The notes are the site's changelog for the version, not
      # `--generate-notes`: that writes the commit subjects since the last tag,
      # which is a record of work rather than of what the app can now do, and
      # the changelog is written by hand for exactly that reason. The `.mdx` is
      # a Markdown list under a line of `export`s, so the exports are dropped
      # and the rest is the body. A version without a changelog still gets a
      # release, with only the compare link, rather than no release at all.
      - name: Publish the release
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          notes=$(mktemp)
          changelog="apps/web/src/content/changelog/${version}.mdx"
          if [ -f "$changelog" ]; then
            grep -v '^export ' "$changelog" | sed '/./,$!d' >> "$notes"
            echo >> "$notes"
          fi
          if [ -n "$previous" ]; then
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}" >> "$notes"
          fi
          gh release create "$TAG" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/latest-mac.yml \
            --title "Prequel $TAG" \
            --notes-file "$notes" \
            --verify-tag

  # The CDN copy, and the manifest the site reads to find it.
  #
  # Invoked rather than left to `release: published`: a release created by the
  # step above is authored by this workflow's own `GITHUB_TOKEN`, and GitHub
  # deliberately raises no event for those — the recursion guard — so nothing
  # would ever run. `secrets: inherit` because the mirror needs the R2 keys and
  # the account id, none of which this job touches.
  mirror:
    needs: package
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-mirror.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

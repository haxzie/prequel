name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be retried without pushing an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run pointless, and macOS
# minutes bill at ten times the Linux rate — an abandoned run is worth cancelling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting needs no toolchain and no Apple framework, so it runs on the cheap
  # image and fails in under a minute rather than behind a macOS build.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  checks:
    # macOS 15 on arm64, which is the only thing this ships for: the capture core
    # is ScreenCaptureKit, AVFoundation and Metal, so none of it builds elsewhere.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `SpeechAnalyzer` is a macOS 26 API, and the runner's default is Xcode
      # 16.4 — whose SDK does not contain it, so `crates/prequel-speech` fails
      # to compile with "cannot find 'SpeechAnalyzer' in scope" rather than
      # with anything that names the real problem. The app still *runs* on
      # macOS 14: the analyzer is behind `if #available`, and a newer SDK is
      # what makes that gate work at all.
      #
      # Newest 26 present rather than a pinned patch, so an image update that
      # drops 26.3 for 26.4 does not break the build.
      - name: Build against the macOS 26 SDK
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `ffprobe` is not on the macOS image, and the encoder's tests shell out to
      # it to check that what was written is actually playable. Without it those
      # tests fail rather than skip.
      - name: Install ffmpeg
        run: brew install ffmpeg

      # Seeds `.env` from `.env.example` through the root `prepare` script, which
      # is what makes the env schema resolve without any secrets in CI.
      - run: pnpm install --frozen-lockfile

      # Builds the native addon as well as the apps: `@prequel/recorder` emits
      # `index.d.ts` from the Rust, and the desktop typecheck reads it.
      - run: pnpm build

      - run: pnpm typecheck

      - name: Test (JavaScript)
        run: pnpm turbo run test

      # Not `-D warnings`. Two warnings already stand in `prequel-capture` — two
      # extern declarations that disagree with the SDK's own signatures — and
      # failing on them would mean this job could never pass until they are fixed.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # A hosted runner turns out to hold the Screen Recording grant and offer a
      # display, so the live capture tests do not skip themselves — they run
      # against a paravirtualised 1024px display that is not Retina and cannot
      # sustain a frame rate, and fail on both counts. `PREQUEL_NO_LIVE_CAPTURE`
      # turns those four off; see the note in `records_the_screen.rs` for why the
      # environment is told to skip rather than sniffed for.
      #
      # Everything else still runs, including the Metal golden-pixel renders,
      # which do get a GPU here.
      - name: Test (Rust)
        env:
          PREQUEL_NO_LIVE_CAPTURE: "1"
        run: cargo test --workspace

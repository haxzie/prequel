name: Mirror release to R2

# Everything a download or an update needs, on assets.prequel.sh.
#
# The disk image the site hands out, the zip and `latest-mac.yml` the updater
# reads, the notes the update window shows, and a `latest.json` that says where
# the image is.
#
# The GitHub release stays the source of truth and is untouched — this is built
# from it — but nothing on a user's path reaches it any more, and that is not a
# performance choice. The repository is private, so a release asset answers 404
# to anybody without a token and `electron-updater` sends none: pointed at
# GitHub, every installed copy checked, got a 404 for the channel file, and said
# it could not check for updates. `/v1/updates` in the Worker redirects here
# instead — see `apps/api/src/lib/releases.ts`.
#
# The download is also simply faster. Cloudflare against GitHub's release CDN is
# the difference between a few seconds and a few minutes on a 100 MB image.
#
# It also takes the site off GitHub's API for the one answer it needs most.
# `/download` had to cache the releases list for ten minutes, because
# unauthenticated GitHub allows 60 requests an hour per IP and the IP is the
# serverless region's, shared by every visitor. `latest.json` is ours, so the
# cache can be sixty seconds and a release is downloadable the moment it exists.
#
# Called by `build.yml` once the release is published, rather than left to the
# `release: published` event: a release created by that workflow's own
# `GITHUB_TOKEN` deliberately does not raise one — GitHub's recursion guard —
# so nothing would ever run. The event trigger is kept for a release published
# by hand, where a human's token does raise it.
#
# Repository secrets:
#   R2_ACCOUNT_ID          Cloudflare dashboard → R2 → Account details
#   R2_ACCESS_KEY_ID       R2 → Manage API tokens, object read+write on `prequel`
#   R2_SECRET_ACCESS_KEY
#
# The same three names `apps/api/.dev.vars` uses, so there is one set of R2
# credentials in this project rather than one per place that writes to it. The
# endpoint is built from the account id the way `upload-backgrounds.ts` builds
# it — R2 serves every bucket off one account hostname.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.0.16"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.0.16"
        required: true
        type: string

permissions:
  contents: read

# One bucket and one latest.json, so two runs must never overlap. Not cancelled
# either: a run stopped between the upload and the manifest leaves a disk image
# in the bucket that nothing points at, which is the one state this cannot tidy
# up after itself.
concurrency:
  group: release-mirror
  cancel-in-progress: false

env:
  BUCKET: prequel
  # Beside `backgrounds/`, which is already served from this domain.
  PREFIX: desktop
  PUBLIC_URL: https://assets.prequel.sh
  # The AWS CLI sends integrity headers R2 rejects unless they are asked for
  # only where the protocol requires them.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: auto

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "::error::$TAG is not a release tag."; exit 1 ;;
          esac
          version="${TAG#v}"

          # The whole payload, not just the image: the updater reads the zip
          # and `latest-mac.yml` through this mirror too, because it cannot read
          # them from a private release.
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*-mac.zip' --pattern 'latest-mac.yml' \
            --dir dist
          for pattern in '*.dmg' '*-mac.zip'; do
            count=$(ls dist/$pattern 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "::error::expected exactly one $pattern in $TAG, found $count."
              exit 1
            fi
          done
          # Without the channel file an installed copy has nothing to check, so
          # a release missing it is a release nobody receives.
          if [ ! -f dist/latest-mac.yml ]; then
            echo "::error::$TAG has no latest-mac.yml. Nothing would ever update."
            exit 1
          fi
          file=$(basename "$(ls dist/*.dmg)")
          zip=$(basename "$(ls dist/*-mac.zip)")

          # Read from the release rather than from the event payload, so a
          # manual re-run carries the timestamp the automatic one would have.
          # The body is the notes the update window shows — written here as a
          # file beside the build, because the Worker that serves it holds no
          # GitHub token and a private repository's releases need one.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,publishedAt \
            --jq '{publishedAt: .publishedAt, notes: .body}' > release.json
          jq --arg version "$version" '{version: $version} + .' release.json > notes.json
          published_at=$(jq -r .publishedAt notes.json)
          cat notes.json

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "file=$file"
            echo "zip=$zip"
            echo "size=$(stat -c%s "dist/$file")"
            echo "sha256=$(sha256sum "dist/$file" | cut -d' ' -f1)"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"

      # Guards a manual re-mirror of an older tag: pointing latest.json at a
      # build that predates the current one would downgrade every download on
      # the site, silently and for everybody.
      - name: Refuse to go backwards
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          current=$(curl -fsSL "$PUBLIC_URL/$PREFIX/latest.json" 2>/dev/null |
            sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -n 1) || current=""
          if [ -z "$current" ]; then
            echo "no latest.json yet — $VERSION will be the first."
            exit 0
          fi
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
          if [ "$newest" != "$VERSION" ] && [ "$current" != "$VERSION" ]; then
            echo "::error::latest.json already points at $current, which is newer than $VERSION."
            exit 1
          fi

      # Everything under a version prefix, and before either pointer below:
      # `latest-mac.yml` names the zip, and a channel file that arrives first
      # names a file that is not there yet — which is an update check that finds
      # a version and then fails to download it.
      - name: Upload the build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          ZIP: ${{ steps.release.outputs.zip }}
        run: |
          set -eu
          endpoint="https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          # Version-pinned keys, so these objects never change and can be cached
          # for as long as anyone cares to keep them.
          immutable="public, max-age=31536000, immutable"

          aws s3 cp "dist/$FILE" "s3://$BUCKET/$PREFIX/$VERSION/$FILE" \
            --endpoint-url "$endpoint" \
            --content-type application/x-apple-diskimage \
            --cache-control "$immutable" \
            --only-show-errors

          # The updater's payload. Squirrel downloads the zip, not the image.
          aws s3 cp "dist/$ZIP" "s3://$BUCKET/$PREFIX/$VERSION/$ZIP" \
            --endpoint-url "$endpoint" \
            --content-type application/zip \
            --cache-control "$immutable" \
            --only-show-errors

          # Read by `/v1/updates/notes` once per check. A version whose notes
          # are missing is a modal with no changelog in it, not a failed check.
          aws s3 cp notes.json "s3://$BUCKET/$PREFIX/$VERSION/notes.json" \
            --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "$immutable" \
            --only-show-errors

      - name: Update the pointers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          SIZE: ${{ steps.release.outputs.size }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          set -eu
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg filename "$FILE" \
            --arg url "$PUBLIC_URL/$PREFIX/$VERSION/$FILE" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            '{
              version: $version,
              tag: $tag,
              publishedAt: $publishedAt,
              platform: "darwin-arm64",
              filename: $filename,
              url: $url,
              size: $size,
              sha256: $sha256
            }' > latest.json
          cat latest.json

          # Short TTL: these are the two objects that change, and a release
          # nobody can see for an hour is a release that did not happen. The
          # site's own revalidate matches this number rather than guessing at
          # one, and the updater checks at most twice an hour anyway.
          moving="public, max-age=60"
          endpoint="https://$ACCOUNT_ID.r2.cloudflarestorage.com"

          aws s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type application/json \
            --cache-control "$moving" \
            --only-show-errors

          # The updater's half of the same answer, and the last thing written:
          # this is the object every installed copy reads, so until it moves the
          # release is not being offered to anybody.
          #
          # `text/yaml` rather than the `binary/octet-stream` R2 would infer.
          # electron-updater parses the body whatever the type says, but a type
          # that makes a browser download the file turns looking at the feed by
          # hand into a puzzle.
          aws s3 cp dist/latest-mac.yml "s3://$BUCKET/$PREFIX/latest-mac.yml" \
            --endpoint-url "$endpoint" \
            --content-type text/yaml \
            --cache-control "$moving" \
            --only-show-errors

      # Through the public domain rather than the bucket, because that is the
      # path the site and every visitor take — a bucket write that succeeds
      # behind a custom domain that is not serving it is the failure this
      # catches.
      - name: Check it is actually there
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          ZIP: ${{ steps.release.outputs.zip }}
        run: |
          set -eu
          curl -fsSL "$PUBLIC_URL/$PREFIX/latest.json" | tee /dev/stderr | grep -q "\"version\": \"$VERSION\""

          # The channel file by content, not by status. A 200 serving the
          # previous version's yaml is exactly the failure that leaves every
          # installed copy on the build before this one, and it looks like a
          # working mirror from the outside.
          curl -fsSL "$PUBLIC_URL/$PREFIX/latest-mac.yml" | tee /dev/stderr |
            grep -q "^version: $VERSION$"

          for path in "$VERSION/$FILE" "$VERSION/$ZIP" "$VERSION/notes.json"; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$PUBLIC_URL/$PREFIX/$path")
            [ "$code" = "200" ] || { echo "::error::$PUBLIC_URL/$PREFIX/$path returned $code"; exit 1; }
          done

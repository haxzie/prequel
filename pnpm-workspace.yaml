packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Windows installer toolchain — only needed when packaging for Windows.
  electron-winstaller: false
  # Downloads the Electron binary for this platform.
  electron: true
  esbuild: true
  # The Workers runtime the API's `wrangler dev` and its tests run inside.
  workerd: true
  # posthog-js pulls this in; its only install script prints a funding notice.
  core-js: false
minimumReleaseAgeExclude:
  - '@napi-rs/cli@3.8.5'

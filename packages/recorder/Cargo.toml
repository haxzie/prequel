[package]
name = "prequel-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
prequel-camera = { workspace = true }
prequel-capture = { workspace = true }
prequel-encode = { workspace = true }
prequel-render = { workspace = true }
prequel-session = { workspace = true }
prequel-speech = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[build-dependencies]
napi-build = "2"

[workspace]
resolver = "3"
members = ["crates/*", "packages/recorder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# FSL-1.1-ALv2 is not an SPDX identifier, so the file is named instead.
# Inherited `license-file` resolves relative to this workspace root.
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
prequel-camera = { path = "crates/prequel-camera" }
prequel-capture = { path = "crates/prequel-capture" }
prequel-session = { path = "crates/prequel-session" }
prequel-encode = { path = "crates/prequel-encode" }
prequel-keysound = { path = "crates/prequel-keysound" }
prequel-render = { path = "crates/prequel-render" }
prequel-sensitive = { path = "crates/prequel-sensitive" }
prequel-speech = { path = "crates/prequel-speech" }
prequel-voice = { path = "crates/prequel-voice" }

# Apple framework bindings. cidre covers ScreenCaptureKit, AVFoundation,
# VideoToolbox and CoreMedia with one shared type system, so CMSampleBuffers
# flow from capture into the encoder without conversion.
#
# Pinned to an exact version on purpose: cidre is a single-maintainer crate and
# tracks Apple SDKs closely, so a floating minor could break the build.
cidre = { version = "=0.20.0", default-features = false }

# The secret rules are a couple of dozen vendor prefixes — `sk-ant-api03-`,
# `ghp_`, `AKIA` + 16 base36, a JWT's three base64url segments. One `RegexSet`
# answers "does this token match any rule" in a single pass over it, where two
# dozen hand-rolled scanners would be two dozen chances to get a character class
# subtly wrong and mask the wrong thing. Only `prequel-sensitive` uses it, and
# only for shape: every category still has its own validator afterwards, and the
# byte-to-UTF-16 offset table a Vision rect needs is hand-built either way.
regex = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
# `symbols`, not `debuginfo`: the addon exports exactly one dynamic symbol,
# `napi_register_module_v1`, and `debuginfo` keeps the other 4,772 local Rust
# symbols — 450 KB, a quarter of the file — purely so a panic can print a
# readable backtrace. The panics that matter cross into JavaScript as errors
# with their own message, and the ones that do not are read from a core file
# with the build's artefacts to hand. Worth 450 KB of every download.
strip = "symbols"
